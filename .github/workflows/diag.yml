# 临时诊断 workflow：查生产 Portainer stack 容器状态与日志（手动触发，用完即删）
name: portainer-diag
on:
  workflow_dispatch:
    inputs:
      logs:
        description: "是否拉取容器日志 (yes/no)"
        default: "yes"

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: pro
    steps:
      - name: 查询生产容器状态与日志
        env:
          URL: ${{ secrets.PORTAINER_URL || vars.PORTAINER_URL }}
          KEY: ${{ secrets.PORTAINER_KEY }}
          WANT_LOGS: ${{ github.event.inputs.logs }}
        run: |
          set -e
          echo "=== containers (all) ==="
          IDS=$(curl -sSf -H "X-API-Key: ${KEY}" "${URL}/api/endpoints/3/docker/containers/json?all=true" \
            | jq -r '.[] | "\(.Id) \(.Names[0]) \(.State) \(.Status)"' | tee /dev/stderr | awk '{print $1}')
          if [ "${WANT_LOGS}" = "yes" ]; then
            for id in $IDS; do
              NAME=$(curl -sSf -H "X-API-Key: ${KEY}" "${URL}/api/endpoints/3/docker/containers/${id}/json" | jq -r '.Name')
              echo "=== logs ${NAME} (tail 100, stdout+stderr) ==="
              curl -sSf -H "X-API-Key: ${KEY}" \
                "${URL}/api/endpoints/3/docker/containers/${id}/logs?stdout=true&stderr=true&tail=100" \
                | tail -c 8000
              echo
            done
          fi
