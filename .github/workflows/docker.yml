name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取版本号（VERSION 文件）
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送统一应用镜像（GoFrame API + Vue 静态资源）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: 清理旧版本镜像 tag（保留最近 5 个版本 + latest）
        uses: actions/delete-package-versions@v5
        with:
          package-name: study_planet
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  # CI 构建成功后，通过 Portainer API 重新部署线上环境（环境 pro：PORTAINER_URL / PORTAINER_KEY）
  deploy-pro:
    runs-on: ubuntu-latest
    needs: build-push
    environment: pro
    steps:
      - name: 通过 Portainer API 重新部署线上容器编排
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL || vars.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_KEY }}
          STACK_NAME: study_planet
        run: |
          set -euo pipefail
          URL="${PORTAINER_URL%/}"
          # 按名称查找目标 stack
          STACK_JSON=$(curl -sSf -H "X-API-Key: ${PORTAINER_KEY}" "${URL}/api/stacks")
          STACK=$(echo "$STACK_JSON" | jq -r --arg n "$STACK_NAME" '.[] | select(.Name == $n) | "\(.Id) \(.EndpointId)"' | head -1)
          if [ -z "$STACK" ]; then
            echo "::error::未找到名为 ${STACK_NAME} 的 stack，现有 stacks："
            echo "$STACK_JSON" | jq -r '.[] | "id=\(.Id) name=\(.Name) endpoint=\(.EndpointId)"'
            exit 1
          fi
          STACK_ID=${STACK%% *}
          ENDPOINT_ID=${STACK##* }
          echo "目标 stack id=${STACK_ID}, endpoint=${ENDPOINT_ID}"
          # 取当前 compose 文件与 env 变量（PUT 更新必须回传 env，否则 stack 环境变量会丢）
          FILE_JSON=$(curl -sSf -H "X-API-Key: ${PORTAINER_KEY}" "${URL}/api/stacks/${STACK_ID}/file")
          FILE=$(echo "$FILE_JSON" | jq -r '.StackFileContent')
          ENV_JSON=$(curl -sSf -H "X-API-Key: ${PORTAINER_KEY}" "${URL}/api/stacks/${STACK_ID}" | jq -c '.Env // []')
          echo "当前编排文件已获取（$(echo "$FILE" | wc -l) 行，env $(echo "$ENV_JSON" | jq length) 项），开始重新部署..."
          HTTP_CODE=$(curl -sS -o /tmp/put-resp.txt -w '%{http_code}' -X PUT \
            -H "X-API-Key: ${PORTAINER_KEY}" \
            -H "Content-Type: application/json" \
            "${URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            -d "$(jq -n --arg f "$FILE" --argjson e "$ENV_JSON" '{stackFileContent:$f, env:$e, prune:true, pullImage:true}')")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Portainer 返回 ${HTTP_CODE}: $(cat /tmp/put-resp.txt)"
            exit 1
          fi
          echo "重新部署成功：ghcr.io/ayflying/study_planet:latest"
