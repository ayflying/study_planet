services:
  studyplanet:
    # 默认拉取 CI 构建的 latest 镜像；本地构建调试时加 --build 或注释掉 image 保留 build
    image: ghcr.io/ayflying/study_planet:latest
    build: .   # 本地调试用；服务器部署时注释掉此行以使用 CI 镜像
    container_name: studyplanet
    restart: unless-stopped
    # 隐私配置从 .env 读取（见 .env.example 模板；.env 不入库）
    env_file:
      - .env
    ports:
      - "18180:8080"   # 宿主端口:容器端口；按需修改宿主端口避免冲突
    environment:
      # 隐私/环境配置统一放 .env（env_file 加载），此处只留非敏感注释备查：
      # PARENT_PIN / JWT_SECRET / CASDOOR_* 均在 .env 中维护
      - TZ=Asia/Shanghai
    volumes:
      - db:/app/data              # SQLite 文件持久化，容器重建不丢数据
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db:
