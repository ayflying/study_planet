<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a3d8f"/>
      <stop offset="60%" stop-color="#1b2660"/>
      <stop offset="100%" stop-color="#10173f"/>
    </radialGradient>
    <linearGradient id="planetBody" x1="18%" y1="12%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#e8630a"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee8fa"/>
      <stop offset="100%" stop-color="#4bc3f7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b53d4"/>
      <stop offset="100%" stop-color="#2b31a8"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板：星空 -->
  <rect width="512" height="512" rx="108" fill="url(#skyGlow)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="88" cy="96" r="5" opacity=".9"/>
    <circle cx="150" cy="58" r="3.2" opacity=".65"/>
    <circle cx="420" cy="80" r="4.5" opacity=".85"/>
    <circle cx="452" cy="180" r="3" opacity=".6"/>
    <circle cx="62" cy="230" r="3.4" opacity=".7"/>
    <circle cx="392" cy="428" r="4.2" opacity=".8"/>
    <circle cx="118" cy="404" r="3" opacity=".6"/>
    <path d="M256 44l6.5 15 15 6.5-15 6.5-6.5 15-6.5-15-15-6.5 15-6.5z" fill="#ffe08a" opacity=".95"/>
    <path d="M452 320l4.6 10.4L467 335l-10.4 4.6L452 350l-4.6-10.4L437 335l10.4-4.6z" fill="#ffe08a" opacity=".8"/>
    <path d="M70 330l4.6 10.4L85 345l-10.4 4.6L70 360l-4.6-10.4L55 345l10.4-4.6z" fill="#ffe08a" opacity=".8"/>
  </g>

  <!-- 星球本体（学士帽戴在顶部） -->
  <circle cx="256" cy="290" r="128" fill="url(#planetBody)"/>

  <!-- 星球表面纹理：陆地斑块 -->
  <g fill="#ffb84d" opacity=".55">
    <ellipse cx="206" cy="270" rx="34" ry="20"/>
    <ellipse cx="300" cy="250" rx="24" ry="14"/>
    <ellipse cx="284" cy="340" rx="30" ry="17"/>
    <ellipse cx="196" cy="332" rx="18" ry="11"/>
  </g>
  <g fill="#f07f13" opacity=".35">
    <ellipse cx="330" cy="310" rx="16" ry="9"/>
    <ellipse cx="238" cy="366" rx="13" ry="8"/>
  </g>

  <!-- 高光 -->
  <ellipse cx="216" cy="232" rx="42" ry="26" fill="#fff3d6" opacity=".38"/>

  <!-- 星环（后段在星球后面） -->
  <g transform="rotate(-18 256 290)">
    <path d="M96 322 C 140 380, 372 380, 416 322 C 400 302, 372 296, 352 306
             C 300 336, 212 336, 160 306 C 140 296, 112 302, 96 322 Z"
          fill="url(#ringBack)" opacity=".9"/>
  </g>
  <!-- 星环前段（压在星球前面） -->
  <g transform="rotate(-18 256 290)">
    <path d="M104 318 C 150 366, 362 366, 408 318
             C 400 308, 388 304, 376 308
             C 330 342, 182 342, 136 308
             C 124 304, 112 308, 104 318 Z"
          fill="#9df2ff" opacity=".95"/>
  </g>

  <!-- 学士帽（戴在星球顶部，稍向左倾） -->
  <g transform="rotate(-8 236 176)">
    <polygon points="236,132 340,172 236,212 132,172" fill="url(#capGrad)"/>
    <!-- 帽檐下面的小梯形（帽座） -->
    <rect x="204" y="196" width="64" height="18" rx="6" fill="#22288c"/>
    <!-- 流苏：中点垂下 -->
    <line x1="236" y1="172" x2="236" y2="240" stroke="#ffc93c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="236" cy="248" r="11" fill="#ffc93c"/>
  </g>

  <!-- 小卫星伴侣：书？用小火箭表示学习旅程 -->
  <g transform="translate(392 210) rotate(24)">
    <path d="M0,-26 C10,-12 10,8 0,22 C-10,8 -10,-12 0,-26 Z" fill="#eef6ff"/>
    <circle cx="0" cy="-4" r="6" fill="#57c7ff"/>
    <path d="M-7,10 L-16,24 L-4,19 Z M7,10 L16,24 L4,19 Z" fill="#ff7b54"/>
    <rect x="-3.5" y="18" width="7" height="9" rx="3" fill="#ff5d3a"/>
  </g>
</svg>
